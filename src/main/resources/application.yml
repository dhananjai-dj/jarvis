spring:
  ai:
    mcp:
      client:
        stdio:
          connections:
            google-calendar:
              command: /opt/homebrew/bin/google-calendar-mcp
              env:
                GOOGLE_OAUTH_CREDENTIALS: ${GOOGLE_OAUTH_CREDENTIALS}
                HOME: /Users/dhananjai_dj
                PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
            spotify:
              command: node
              args:
                - /Users/dhananjai_dj/dev/spotify-mcp-server/build/index.js
            telegram:
              command: /Users/dhananjai_dj/.local/bin/mcp-telegram
              args:
                - "start"
              env:
                API_ID: ${TELEGRAM_API_ID}
                API_HASH: ${TELEGRAM_API_HASH}
            zepto:
              command: npx
              args: [ "-y", "mcp-remote", "https://mcp.zepto.co.in/mcp" ]
              env:
                PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
                HOME: /Users/dhananjai_dj
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite

    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      chat:
        model: qwen/qwen3.8-27b
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/jarvis
    username: ${JARIVS_DB_USER_NAME}
    password: ${JARVIS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        register-health-indicator: true
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 120s
        permitted-number-of-calls-in-half-open-state: 5

logging:
  level:
    root: INFO
    io.modelcontextprotocol: DEBUG